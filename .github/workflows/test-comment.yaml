name: Append via /test with Verified Signature

on:
  issue_comment:
    types: [created]

jobs:
  append-line:
    if: github.event.comment.body == '/test' && github.event.issue.pull_request != null
    runs-on: ubuntu-latest

    steps:
      - name: Get PR branch info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('branch', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);

      - name: Get file content and commit via GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GIT_TOKEN }}
          script: |
            const branch = "${{ steps.pr.outputs.branch }}";
            const filePath = "test.txt";

            const { data: fileData } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              ref: branch
            });

            const content = Buffer.from(fileData.content, 'base64').toString('utf-8');
            const newContent = content + '\nThis is test';

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              message: "chore: append test line via /test comment",
              content: Buffer.from(newContent, 'utf-8').toString('base64'),
              sha: fileData.sha,
              branch: branch,
              committer: {
                name: "GitHub Actions",
                email: "41898282+github-actions[bot]@users.noreply.github.com"
              },
              author: {
                name: "GitHub Actions",
                email: "41898282+github-actions[bot]@users.noreply.github.com"
              }
            });
