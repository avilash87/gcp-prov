name: Append Test Line on /test Comment

on:
  issue_comment:
    types: [created]

jobs:
  append-line:
    if: github.event.comment.body == '/test' && github.event.issue.pull_request != null
    runs-on: ubuntu-latest

    steps:
      - name: Extract PR branch name
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput("branch", pr.data.head.ref);

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Append line to file
        run: echo "This is test" >> test.txt

      - name: Commit and push
        run: |
          git add test.txt
          git commit -m "chore: append test line from /test comment"
          git push origin HEAD
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
